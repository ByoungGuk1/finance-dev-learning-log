<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>사원 관리</title>
<style>
body {
	font-family: sans-serif;
	padding: 20px;
}

table {
	border-collapse: collapse;
	width: 100%;
	margin-top: 10px;
}

th, td {
	border: 1px solid #ccc;
	padding: 8px 12px;
	text-align: center;
}

th {
	background: #1F3864;
	color: #fff;
}

input {
	padding: 6px 10px;
	margin: 4px;
	border: 1px solid #ccc;
	border-radius: 4px;
}

button {
	padding: 7px 16px;
	margin: 4px;
	border: none;
	border-radius: 4px;
	background: #2563eb;
	color: #fff;
	cursor: pointer;
}

button:hover {
	background: #1d4ed8;
}

#formBox {
	background: #f9fafb;
	border: 1px solid #e5e7eb;
	border-radius: 8px;
	padding: 16px;
	margin-top: 16px;
	display: none;
}

#detail-select {
	border: 1px solid #e5e7eb;
}
</style>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="./emplist.js"></script>
</head>
<body>

	<h2>🧑‍💼 사원 관리 (JSP + Servlet + jQuery Ajax)</h2>

	<!-- 조회 영역 -->
	<div>
		<button id="btnAll">전체 조회</button>
		<input type="text" id="searchName" placeholder="이름 검색">
		<button id="btnSearch">조건 조회</button>
		<button id="btnNew" style="margin-top: 12px; background: #16a34a;">+
			신규 입력</button>
		<div id="detail-select">
			<label id="dept-label">부서 : </label> <select id="select-dept-id"
				name="dept_id">
				<option value="dept-deptid">전체</option>
			</select> <label id="job-label">직무 : </label> <select id="select-job-id"
				name="job_id">
				<option value="job-jobid">전체</option>
			</select> <input type="number" id="select-salary" name="salary"
				placeholder="급여(이상)"><input type="date"
				id="select-hire-date" name="hire-date">
			<button id="detail-find-btn">여러조건 조회</button>
		</div>
	</div>
	<!-- 입력/수정 폼 -->
	<div id="formBox">
		<form id="myfrm">
			<h3 id="formTitle">사원 입력</h3>
			<input type="text" id="employee_id" name="employee_id" value=""
				data-empid="">
			<!--  -->
			<input type="text" id="first_name" name="first_name" placeholder="이름">
			<!--  -->
			<input type="text" id="last_name" name="last_name" placeholder="성">
			<!--  -->
			<input type="text" id="email" name="email" placeholder="email">
			<!--  -->
			<input type="text" id="job_id" name="job_id"
				placeholder="직무(예:IT_PROG)">
			<!--  -->
			<input type="number" id="department_id" name="department_id"
				placeholder="부서번호">
			<!--  -->
			<input type="number" id="salary" name="salary" placeholder="급여">
			<!--  -->
			<input type="date" id="hire_date" name="hire_date" placeholder="입사일">

			<button id="btnSave">저장</button>
			<button id="btnCancel" style="background: #6b7280;">취소</button>
		</form>
	</div>
	<!-- 목록 테이블 -->
	<table id="empTable">
		<thead>
			<tr>
				<th>사번</th>
				<th>이름</th>
				<th>성</th>
				<th>이메일</th>
				<th>직무</th>
				<th>부서</th>
				<th>급여</th>
				<th>관리</th>
			</tr>
		</thead>
		<tbody id="empBody"></tbody>
	</table>

</body>
</html>
