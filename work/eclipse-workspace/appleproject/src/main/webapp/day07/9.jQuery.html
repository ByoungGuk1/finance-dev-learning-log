<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>jQuery 선택자 & DOM 실습</title>
<style>
body {
	font-family: sans-serif;
	padding: 32px;
	background: #f3f4f6;
}

section {
	background: #fff;
	border-radius: 10px;
	padding: 20px 24px;
	margin-bottom: 20px;
	box-shadow: 0 2px 6px rgba(0, 0, 0, 0.07);
}

h3 {
	color: #1F3864;
	font-size: 0.95rem;
	margin-bottom: 14px;
	padding-bottom: 6px;
	border-bottom: 2px solid #2E75B6;
}

/* 버튼 */
.btn {
	display: inline-block;
	padding: 7px 16px;
	background: #2E75B6;
	color: #fff;
	border: none;
	border-radius: 6px;
	font-size: 0.88rem;
	cursor: pointer;
	margin: 4px;
	font-family: inherit;
}

.btn:hover {
	background: #1F3864;
}

.btn.active {
	background: #1D9E75;
}

.btn.disabled {
	background: #9ca3af;
	cursor: not-allowed;
}

/* 카드 */
.card {
	display: inline-block;
	padding: 10px 16px;
	background: #e0e7ff;
	border-radius: 8px;
	margin: 4px;
	font-size: 0.88rem;
}

/* 목록 */
ul {
	list-style: none;
	padding: 0;
	margin: 0;
}

li {
	padding: 7px 12px;
	border-bottom: 1px solid #f3f4f6;
	font-size: 0.88rem;
	color: #374151;
}

li.active {
	background: #d1fae5;
	color: #065f46;
	font-weight: 700;
}

/* item (hide/show 대상) */
.item {
	display: inline-block;
	padding: 6px 14px;
	background: #fef3c7;
	border-radius: 6px;
	margin: 4px;
	font-size: 0.88rem;
}

/* 입력 */
input {
	padding: 8px 12px;
	border: 1px solid #d1d5db;
	border-radius: 6px;
	font-size: 0.9rem;
	outline: none;
	margin: 4px;
}

input:focus {
	border-color: #2E75B6;
}

/* 실행 버튼 모음 */
.run-btn {
	padding: 6px 14px;
	background: #D85A30;
	color: #fff;
	border: none;
	border-radius: 6px;
	font-size: 0.82rem;
	cursor: pointer;
	margin: 3px;
	font-family: inherit;
}

.run-btn:hover {
	background: #9a2c0e;
}

/* 콘솔 */
#logBox, #logBox2 {
	background: #1e293b;
	color: #94a3b8;
	border-radius: 8px;
	padding: 14px 16px;
	font-family: Consolas, monospace;
	font-size: 0.82rem;
	line-height: 1.8;
	min-height: 48px;
	margin-top: 8px;
}

.log-sel {
	color: #7dd3fc;
}

.log-dom {
	color: #86efac;
}

.log-warn {
	color: #fde68a;
}
</style>
</head>
<body>

	<h2 style="color: #1F3864; margin-bottom: 20px;">🔍 jQuery 선택자 &
		DOM 실습</h2>

	<!-- ── 선택자 테스트 대상 ───────────────── -->
	<section>
		<h3>📌 선택자 테스트 대상 요소들</h3>

		<p id="title">나는 #title p 태그입니다</p>
		<p>나는 일반 p 태그입니다</p>

		<div class="card">카드 1</div>
		<div class="card">카드 2</div>
		<div class="card">카드 3</div>

		<ul id="testList">
			<li class="active">첫 번째 li (active)</li>
			<li>두 번째 li</li>
			<li>세 번째 li</li>
			<li class="active">네 번째 li (active)</li>
			<li>다섯 번째 li</li>
		</ul>

		<br> <input type="text" placeholder="text input"> <input
			type="email" placeholder="email input"> <input type="number"
			placeholder="number input"> <br> <br>
		<button class="btn disabled">버튼 (disabled 클래스)</button>
		<button class="btn">버튼 2</button>

		<br> <br> <span class="item">item A</span> <span
			class="item">item B</span> <span class="item">item C</span>
	</section>

	<!-- ── 선택자 실행 버튼 ──────────────────── -->
	<section>
		<h3>① 선택자 — 버튼 클릭 시 콘솔 출력</h3>

		<button class="run-btn" id="sel1">$('p')</button>
		<button class="run-btn" id="sel2">$('.card')</button>
		<button class="run-btn" id="sel3">$('#title')</button>
		<button class="run-btn" id="sel4">$('ul > li')</button>
		<button class="run-btn" id="sel5">$('input[type=email]')</button>
		<button class="run-btn" id="sel6">$('li:first-child')</button>
		<button class="run-btn" id="sel7">$('li:not(.active)')</button>

		<div id="logBox"></div>
	</section>

	<!-- ── DOM 조작 실행 버튼 ────────────────── -->
	<section>
		<h3>② DOM 조작 — 버튼 클릭 시 적용</h3>

		<button class="run-btn" id="dom1">#title .text()</button>
		<button class="run-btn" id="dom2">.card .html()</button>
		<button class="run-btn" id="dom3">input .val()</button>
		<button class="run-btn" id="dom4">.btn .css()</button>
		<button class="run-btn" id="dom5">.btn addClass / removeClass</button>
		<button class="run-btn" id="dom6">ul에 li 추가</button>
		<button class="run-btn" id="dom7">.item .remove()</button>
		<button class="run-btn" id="dom8">.item .hide()</button>
		<button class="run-btn" id="dom9">.item .show()</button>

		<div id="logBox2"></div>
	</section>

	<!-- jQuery CDN -->
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script>
    $(function() {
      // ── 로그 출력 유틸 ──────────────────────
      function log(msg, type='sel', boxId='logBox') {
        const box  = document.getElementById(boxId);
        const span = document.createElement('span');
        span.className = `log-${type}`;
        span.textContent = `> ${ msg }\n`;
        box.appendChild(span);
      }
      // ══════════════════════════════════════
      // ① 선택자
      // ══════════════════════════════════════

      // $('p') — 태그 선택
      $('#sel1').on('click', function() {
        const els = $('p');
        log(`$('p') → ${els.length}개 선택`, 'sel');
        els.each((i, el) => log(`  [${i}] ${el.textContent.trim()}`, 'sel'));
      });

      // $('.card') — 클래스 선택
      $('#sel2').on('click', function() {
        const els = $('.card');
        log(`$('.card') → ${els.length}개 선택`, 'sel');
        els.css('background', 'green');  // 시각적 표시
      });

      // $('#title') — ID 선택
      $('#sel3').on('click', function() {
        const el = $('#title');
        log(`$('#title') → "${el.text()}"`, 'sel');
        el.css('color', 'orange');
      });

      // $('ul > li') — 직계 자식
      $('#sel4').on('click', function() {
        const els = $('ul > li');
        log(`$('ul > li') → ${els.length}개`, 'sel');
        els.css('background', '#fef9c3');
      });

      // $('input[type=email]') — 속성 선택
      $('#sel5').on('click', function() {
        const el = $('input[type=email]');
        log(`$('input[type=email]') → ${el.length}개`, 'sel');
        el.css('border-color', 'blue');
      });

      // $('li:first-child') — 가상클래스
      $('#sel6').on('click', function() {
        const el = $('li:first-child');
        log(`$('li:first-child') → "${el.text()}"`, 'sel');
        el.css({ background:'yellow', fontWeight:'bold' });
      });

      // $('li:not(.active)') — 제외
      $('#sel7').on('click', function() {
        const els = $('li:not(.active)');
        log(`$('li:not(.active)') → ${els.length}개 (active 제외)`, 'sel');
        els.css('color', 'red');
      });


      // ══════════════════════════════════════
      // ② DOM 조작
      // ══════════════════════════════════════

      // .text()
      $('#dom1').on('click', function() {
        $('#title').text('jQuery로 바꾼 제목!');
        log(`$('#title').text('jQuery로 바꾼 제목!')`, 'dom', 'logBox2');
      });

      // .html()
      $('#dom2').on('click', function() {
        $('.card').html('<b style="color:#1D9E75">HTML 변경!</b>');
        log(`$('.card').html('<b>HTML 변경!</b>')`, 'dom', 'logBox2');
      });

      // .val()
      $('#dom3').on('click', function() {
        $('input').val('jQuery 입력값');
        log(`$('input').val('jQuery 입력값')`, 'dom', 'logBox2');
      });

      // .css()
      $('#dom4').on('click', function() {
        $('.btn').css({ color:'#1D9E75', fontWeight:'bold' });
        log(`$('.btn').css({ color:'#1D9E75', fontWeight:'bold' })`, 'dom', 'logBox2');
      });

      // addClass / removeClass
      $('#dom5').on('click', function() {
        $('.btn').addClass('active').removeClass('disabled');
        log(`$('.btn').addClass('active').removeClass('disabled')`, 'dom', 'logBox2');
      });

      // appendTo
      $('#dom6').on('click', function() {
        $('<li>★ jQuery로 추가된 항목</li>').appendTo('#testList');
        log(`$('<li>새항목</li>').appendTo('ul')`, 'dom', 'logBox2');
      });

      // .remove() ...itemA, itemB, itemC
      $('#dom7').on('click', function() {
        $('.item').remove();
        log(`$('.item').remove() — 삭제됨`, 'warn', 'logBox2');
      });

      // .hide()
      $('#dom8').on('click', function() {
        $('.item').hide();
        log(`$('.item').hide() — display:none`, 'dom', 'logBox2');
      });

      // .show()
      $('#dom9').on('click', function() {
        $('.item').show();
        log(`$('.item').show() — display 복원`, 'dom', 'logBox2');
      });

    });
  </script>
</body>
</html>
