<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<!-- /* 구글 폰트 사용 예 (head의 style보다 위에 link 추가) */ -->
<link
	href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR&display=swap"
	rel="stylesheet">
<style>
body {
	/* 폰트 종류 — 없을 경우 대체폰트 순서로 적용 */
	/* font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; */
	font-size: 16px; /* 기준 크기 */
	font-weight: 400; /* 400=보통, 700=굵게 */
	font-style: normal; /* normal | italic | oblique */
	line-height: 1.6; /* 줄간격 — 단위 없는 숫자 권장 */
	letter-spacing: 0.04em; /* 자간 */
	color: dark;
}

a {
	text-decoration: none;
	border: 1px solid gray;
	padding: 10px;
}

a:hover {
	background-color: yellow;
}

ul {
	list-style-type: none;
} /* disc | circle | square | none */
ol {
	list-style-type: decimal-leading-zero;
} /* decimal | upper-roman | lower-alpha */
</style>
</head>
<body>
	<h1>text style practice</h1>
	<p>text...</p>
	<a href="../emp/list.do">직원 조회</a>
	<ul>
		<li>1번</li>
		<li>2번</li>
		<li>3번</li>
		<li>4번</li>
		<li>5번</li>
		<li>6번</li>
	</ul>
	<ol>
		<li>1번</li>
		<li>2번</li>
		<li>3번</li>
		<li>4번</li>
		<li>5번</li>
		<li>6번</li>
	</ol>
</body>
</html>
