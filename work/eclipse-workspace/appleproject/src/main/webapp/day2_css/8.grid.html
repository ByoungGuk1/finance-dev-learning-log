<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style>
  .layout {
    display: grid;
    grid-template-columns: 180px 1fr;
    grid-template-rows: 64px 1fr 48px;
    grid-template-areas:
      "header  header"
      "sidebar main"
      "footer  footer";
    min-height: 100vh;
    gap: 0;
  }
  .header  { grid-area: header;  background: #1F3864; color:#fff; }
  .sidebar { grid-area: sidebar; background: #f5f5f5; }
  .main    { grid-area: main;    padding: 24px; }
  .footer  { grid-area: footer;  background: #333; color:#fff; }
</style>

</head>
<body>
<div class="layout">
  <header class="header">ShopMall 헤더</header>
  <aside class="sidebar">카테고리</aside>
  <main class="main">상품 목록</main>
  <footer class="footer">푸터</footer>
</div>

</body>
</html>
