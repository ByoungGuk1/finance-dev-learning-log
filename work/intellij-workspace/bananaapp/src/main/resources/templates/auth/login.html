<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
<div class="card shadow-lg" style="max-width:400px;width:100%;">
    <div class="card-body p-4">
        <h5 class="text-center fw-bold mb-4">서비스 로그인</h5>
        <!-- action 생략 → Spring Security가 자동 처리 -->
        <form method="post">
            <div class="mb-3">
                <input class="form-control" name="mid" placeholder="아이디"
                       required type="text" value="member1">
            </div>
            <div class="mb-3">
                <input class="form-control" name="mpassword" placeholder="비밀번호"
                       required type="password" value="1234">
            </div>
            <!-- CSRF 토큰 (csrf 활성화 시 Thymeleaf가 자동 삽입) -->
            <!--<input th:name="${_csrf.parameterName}" th:value="${_csrf.token}"
                   type="text">-->
            <button class="btn btn-primary w-100" type="submit">로그인</button>
        </form>
        <div class="text-center mt-3">
            <a href="/auth/signup">회원가입</a>
        </div>
    </div>
</div>
</body>
</html>
