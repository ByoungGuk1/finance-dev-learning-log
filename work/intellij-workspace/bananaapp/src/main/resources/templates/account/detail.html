<!DOCTYPE html>
<html layout:decorate="~{layouts/default}" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
          name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <title>Document</title>
</head>
<body>
<!-- header fragment로 교체 -->
<!--<header th:replace="~{fragments/header :: siteHeader}"></header>-->

<main layout:fragment="content">
    <div class="form-wrap">
        <!-- object를 사용하면 id, name, value자동
             field는 object의 속성이다.
         -->
        <form method="post" th:action="@{/account/update.do}" th:object="${account}">
            <input placeholder="id" readonly th:field="*{id}" type="text">
            <input placeholder="계좌번호" th:field="*{accountNo}" type="text">
            <input placeholder="예금주" th:field="*{ownerName}" type="text">
            <input placeholder="초기 잔액" th:field="*{balance}" type="number">
            <select th:field="*{accountType}">
                <option value="SAVINGS">저축예금</option>
                <option value="CHECKING">당좌예금</option>
            </select>
            <button type="submit">수정</button>
        </form>
    </div>
    <!-- ════════════════════════════════════════════════
         첨부파일 목록 — collection ResultMap 결과
         account.attachments = List<AttachmentDTO>
         MyBatis가 JOIN 결과를 자동으로 리스트로 그룹핑함
         ════════════════════════════════════════════════ -->
    <h3>첨부서류</h3>
    <table>
        <tr>
            <th>파일명</th>
            <th>종류</th>
            <th>크기</th>
            <th>관리</th>
        </tr>
        <!-- attachments 리스트 반복 -->
        <tr th:each="att : ${account.attachments}">
            <td th:text="${att.originalFilename}"></td>
            <td th:text="${att.fileType}"></td>
            <!-- 파일 크기: byte → KB 변환 -->
            <td th:text="${#numbers.formatInteger(att.fileSize / 1024, 1, 'COMMA')} + ' KB'"></td>
            <td>
                <!-- 다운로드 -->
                <a th:href="@{/account/download/{id}(id=${att.id})}">
                    다운로드
                </a>
                &nbsp;
                <!-- 삭제 -->
                <form method="post"
                      onsubmit="return confirm('파일을 삭제하시겠습니까?')"
                      style="display:inline"
                      th:action="@{/account/attachment/delete/{id}(id=${att.id})}">
                    <input name="accountId" th:value="${account.id}"
                           type="hidden">
                    <button style="color:red;border:none;background:none;cursor:pointer;"
                            type="submit">
                        삭제
                    </button>
                </form>
            </td>
        </tr>
        <!-- 첨부파일 없을 때 -->
        <tr th:if="${#lists.isEmpty(account.attachments)}">
            <td colspan="4">첨부된 서류가 없습니다.</td>
        </tr>
    </table>
    <!-- ── 파일 업로드 ─────────────────────────────────
        enctype="multipart/form-data" 필수!
        ─────────────────────────────────────────────── -->
    <h3>서류 첨부</h3>
    <form enctype="multipart/form-data"
          method="post"
          th:action="@{/account/{id}/upload(id=${account.id})}">
        <input accept=".jpg,.jpeg,.png,.pdf"
               name="file"
               type="file">
        <button type="submit">업로드</button>
    </form>

    <a th:href="@{/account/list.do}">← 목록으로</a>
</main>
</body>
</html>
